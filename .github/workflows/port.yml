name: generate quest3 target
on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'Direct download URL for the Quest 3 OTA zip'
        required: true
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          sudo apt-get install -y llvm e2fsprogs python3-pip
          pip3 install -r requirements.txt
          pip3 install vmlinux-to-elf
          # resolve the versioned asset URL dynamically
          PDGO_URL=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
url = next(
    a['browser_download_url']
    for a in data['assets']
    if 'linux_amd64' in a['name'] and a['name'].endswith('.tar.gz')
)
print(url)
")
          echo "payload-dumper-go URL: $PDGO_URL"
          curl -L "$PDGO_URL" | tar xz -C /tmp
          find /tmp -name 'payload-dumper-go' -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/payload-dumper-go
          payload-dumper-go --version || true
      - name: download OTA
        run: |
          curl -L "${{ github.event.inputs.ota_url }}" -o ota.zip
      - name: generate target
        run: |
          python3 port.py --zip ota.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quest3-target
          path: targets/*.json
